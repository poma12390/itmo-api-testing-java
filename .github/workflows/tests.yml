name: API and UI tests

on:
  push:
    branches: [main, lab2, "homework-*", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    env:
      MAVEN_USER_HOME: ${{ github.workspace }}/.m2
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/ms-playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v4
        with:
          path: .m2
          key: maven-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ matrix.java }}-
      - uses: actions/cache@v4
        with:
          path: .tools/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}
      - name: Install Chromium and Linux dependencies
        run: ./mvnw -B --no-transfer-progress exec:java -Dexec.args="install --with-deps chromium"
      - name: Build and test API and UI
        run: ./mvnw -B --no-transfer-progress -Pui verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/ui-artifacts/
            target/site/jacoco/
          if-no-files-found: ignore
